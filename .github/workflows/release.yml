name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-Content release-files.txt | Where-Object { $_ -like '*.ps1' })
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "parse failed: $f -> $($errors[0].Message)"
              exit 1
            }
            Write-Host "OK: $f"
          }

      - name: Validate install.ps1 has NO BOM
        shell: bash
        run: |
          BOM=$(head -c 3 install.ps1 | xxd -p)
          if [ "$BOM" = "efbbbf" ]; then
            echo "::error::install.ps1 starts with UTF-8 BOM - breaks irm|iex, aborting release"
            exit 1
          fi
          echo "install.ps1 has no BOM, OK"

      - name: Validate tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' does not match VERSION '$version' (expected '$expectedTag')"
          }
          Write-Host "Release tag matches VERSION: $expectedTag"

      - name: Validate cmd flags and log dir logic
        shell: bash
        run: |
          grep -q -- '--daemon' deepseek.cmd || { echo "::error::deepseek.cmd missing --daemon"; exit 1; }
          grep -q -- '"-d"' deepseek.cmd || { echo "::error::deepseek.cmd missing -d alias"; exit 1; }
          grep -q 'New-Item -ItemType Directory' background-run.ps1 || { echo "::error::background-run.ps1 missing log dir creation"; exit 1; }
          grep -q -- '-WaitForReady -TimeoutSeconds 900' start-background.cmd || { echo "::error::start-background.cmd missing interactive wait mode"; exit 1; }
          grep -q -- 'set-shortcut.ps1' install.ps1 || { echo "::error::install.ps1 missing shortcut migration helper"; exit 1; }
          # 回归防护（P0 教训）：upgrade-dsh.ps1 的缓存清理路径必须指向真实目录
          # npm-cache\_npx（少反斜杠 → Test-Path 恒 False → --upgrade 静默失效）
          grep -q 'npm-cache\\_npx' upgrade-dsh.ps1 || { echo "::error::upgrade-dsh.ps1 must clear the REAL npx cache dir (npm-cache\\_npx)"; exit 1; }
          # 回归防护（P1 教训）：deepseek.cmd 必须保留未知参数白名单校验块
          grep -q 'BADARG' deepseek.cmd || { echo "::error::deepseek.cmd missing unknown-argument validation"; exit 1; }
          echo "cmd files OK"

      - name: Run complete Windows behavior suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem ./tests -Filter '*.Tests.ps1' | Sort-Object Name)
          foreach ($test in $tests) {
            Write-Host "Running $($test.Name)..."
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($test.Name) failed with exit code $LASTEXITCODE" }
          }

      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $PWD 'dist/dsh-launcher'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          foreach ($file in @(Get-Content release-files.txt | Where-Object { $_ -and -not $_.StartsWith('#') })) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Release source missing: $file" }
            Copy-Item -LiteralPath $file -Destination $packageRoot
          }
          Compress-Archive -LiteralPath $packageRoot -DestinationPath (Join-Path $PWD 'dist/dsh-launcher.zip') -CompressionLevel Optimal

      - name: Smoke test extracted release archive
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/release-package-behavior.Tests.ps1 -ArchivePath ./dist/dsh-launcher.zip
          if ($LASTEXITCODE -ne 0) { throw "Extracted release smoke test failed with exit code $LASTEXITCODE" }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-launcher.zip
          generate_release_notes: true
