name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('install.ps1','uninstall.ps1','stop-dsh.ps1','start-background.ps1','update-check.ps1','open-when-ready.ps1','upgrade-dsh.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "parse failed: $f -> $($errors[0].Message)"
              exit 1
            }
            Write-Host "OK: $f"
          }

      - name: Validate install.ps1 has NO BOM
        shell: bash
        run: |
          BOM=$(head -c 3 install.ps1 | xxd -p)
          if [ "$BOM" = "efbbbf" ]; then
            echo "::error::install.ps1 starts with UTF-8 BOM - breaks irm|iex, aborting release"
            exit 1
          fi
          echo "install.ps1 has no BOM, OK"

      - name: Validate cmd flags and log dir logic
        shell: bash
        run: |
          grep -q -- '--daemon' deepseek.cmd || { echo "::error::deepseek.cmd missing --daemon"; exit 1; }
          grep -q -- '"-d"' deepseek.cmd || { echo "::error::deepseek.cmd missing -d alias"; exit 1; }
          grep -q 'mkdir' background-run.cmd || { echo "::error::background-run.cmd missing log dir creation"; exit 1; }
          echo "cmd files OK"

      - name: Prepare package
        run: |
          mkdir -p dist/dsh-launcher
          cp deepseek.cmd install-command.cmd start-deepseek-harness.bat \
             start-background.cmd start-background.ps1 stop-dsh.cmd stop-dsh.ps1 \
             open-when-ready.ps1 background-run.cmd install.ps1 update-check.ps1 uninstall.ps1 upgrade-dsh.ps1 \
             deepseek.ico README.md README.en.md VERSION dist/dsh-launcher/
          # Windows 批处理文件必须使用 CRLF 行尾
          sed -i 's/$/\r/' dist/dsh-launcher/*.cmd dist/dsh-launcher/*.bat
          cd dist && zip -r dsh-launcher.zip dsh-launcher

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-launcher.zip
          generate_release_notes: true
