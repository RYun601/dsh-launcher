name: Delete Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to delete (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.inputs.tag;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const rel = releases.find(r => r.tag_name === tag);
            if (!rel) {
              core.setFailed(`Release ${tag} not found - nothing to delete`);
              return;
            }
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.id,
            });
            console.log(`Deleted release ${tag} (id ${rel.id})`);
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              console.log(`Deleted tag ${tag}`);
            } catch (e) {
              console.log(`Tag ${tag} already gone: ${e.message}`);
            }
