name: Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('install.ps1','uninstall.ps1','stop-dsh.ps1','start-background.ps1','update-check.ps1','open-when-ready.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "parse failed: $f -> $($errors[0].Message)"
              exit 1
            }
            Write-Host "OK: $f"
          }

      - name: Validate install.ps1 has NO BOM
        shell: bash
        run: |
          BOM=$(head -c 3 install.ps1 | xxd -p)
          if [ "$BOM" = "efbbbf" ]; then
            echo "::error::install.ps1 starts with UTF-8 BOM - it breaks param() under irm|iex in PS 5.1, remove it"
            exit 1
          fi
          echo "install.ps1 has no BOM, OK (first bytes: $BOM)"

      - name: Validate cmd flags and log dir logic
        shell: bash
        run: |
          grep -q -- '--daemon' deepseek.cmd || { echo "::error::deepseek.cmd missing --daemon"; exit 1; }
          grep -q -- '"-d"' deepseek.cmd || { echo "::error::deepseek.cmd missing -d alias"; exit 1; }
          grep -q 'mkdir' background-run.cmd || { echo "::error::background-run.cmd missing log dir creation"; exit 1; }
          echo "cmd files OK"
