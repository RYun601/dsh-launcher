name: Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('install.ps1','uninstall.ps1','stop-dsh.ps1','start-background.ps1','set-shortcut.ps1','update-check.ps1','open-when-ready.ps1','upgrade-dsh.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "parse failed: $f -> $($errors[0].Message)"
              exit 1
            }
            Write-Host "OK: $f"
          }

      - name: Validate install.ps1 has NO BOM
        shell: bash
        run: |
          BOM=$(head -c 3 install.ps1 | xxd -p)
          if [ "$BOM" = "efbbbf" ]; then
            echo "::error::install.ps1 starts with UTF-8 BOM - it breaks param() under irm|iex in PS 5.1, remove it"
            exit 1
          fi
          echo "install.ps1 has no BOM, OK (first bytes: $BOM)"

      - name: Validate cmd flags and log dir logic
        shell: bash
        run: |
          grep -q -- '--daemon' deepseek.cmd || { echo "::error::deepseek.cmd missing --daemon"; exit 1; }
          grep -q -- '"-d"' deepseek.cmd || { echo "::error::deepseek.cmd missing -d alias"; exit 1; }
          grep -q 'mkdir' background-run.cmd || { echo "::error::background-run.cmd missing log dir creation"; exit 1; }
          grep -q -- '--upgrade' deepseek.cmd || { echo "::error::deepseek.cmd missing --upgrade"; exit 1; }
          grep -q -- '--logs' deepseek.cmd || { echo "::error::deepseek.cmd missing --logs"; exit 1; }
          grep -q -- '--version' deepseek.cmd || { echo "::error::deepseek.cmd missing --version"; exit 1; }
          grep -q -- '-WaitForReady -TimeoutSeconds 900' start-background.cmd || { echo "::error::start-background.cmd missing interactive wait mode"; exit 1; }
          grep -q -- 'set-shortcut.ps1' install.ps1 || { echo "::error::install.ps1 missing shortcut migration helper"; exit 1; }
          test -f VERSION || { echo "::error::VERSION file missing"; exit 1; }
          echo "cmd files OK"

  functional:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate BOM-prefixed irm|iex in PS 5.1 and verify InstallDir defense
        shell: pwsh
        run: |
          $lines = Get-Content install.ps1
          $start = ($lines | Select-String '^param\(').LineNumber
          $end   = ($lines | Select-String '^\$SkipPath = \[bool\]').LineNumber
          if (-not $start -or -not $end) { throw 'param/defense markers not found in install.ps1' }
          $body = ($lines[($start-1)..($end-1)] -join "`n") + "`nWrite-Output ('CHECK=' + `$InstallDir)"
          $script = [string][char]0xFEFF + $body
          $tmp = Join-Path $env:TEMP 'bom-sim.ps1'
          [System.IO.File]::WriteAllText($tmp, $script, (New-Object System.Text.UTF8Encoding($false)))
          $out = powershell.exe -NoProfile -Command "iex (Get-Content -Raw -Encoding UTF8 '$tmp')" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($out -notmatch 'CHECK=.*dsh-launcher' -or $out -match 'CHECK=.*False') {
            throw "BOM defense FAILED - output was: $out"
          }
          Write-Host 'BOM defense OK'

      - name: Positive control - plain iex binds param defaults
        shell: pwsh
        run: |
          $lines = Get-Content install.ps1
          $start = ($lines | Select-String '^param\(').LineNumber
          $end   = ($lines | Select-String '^\$SkipPath = \[bool\]').LineNumber
          $body = ($lines[($start-1)..($end-1)] -join "`n") + "`nWrite-Output ('CHECK=' + `$InstallDir)"
          $tmp = Join-Path $env:TEMP 'plain-sim.ps1'
          [System.IO.File]::WriteAllText($tmp, $body, (New-Object System.Text.UTF8Encoding($false)))
          $out = powershell.exe -NoProfile -Command "iex (Get-Content -Raw -Encoding UTF8 '$tmp')" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($out -notmatch 'CHECK=.*dsh-launcher') { throw "plain iex FAILED: $out" }
          Write-Host 'plain iex OK'

      - name: Run startup behavior regression tests
        shell: pwsh
        run: |
          & ./tests/startup-behavior.Tests.ps1
          & ./tests/shortcut-behavior.Tests.ps1
